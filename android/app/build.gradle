plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
}

android {
    namespace "com.cryptiqapp" // 👈 NECESARIO PARA EVITAR ERROR DE NAMESPACE
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.cryptiqapp"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // Configuraciones para debug si las necesitas
        }
    }
}

repositories {
    // Para que gradle pueda encontrar tu .aar en android/app/libs
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Asegúrate que este nombre coincide EXACTAMENTE con el archivo .aar (sin la extensión)
    implementation(name: 'facetec-sdk-9.7.78', ext: 'aar')

    // Dependencia de Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"

    // Agrega aquí otras dependencias necesarias si las tienes
}
