plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
}

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.cryptiqapp"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // configuraciones debug si tienes
        }
    }
}

// Aquí agregas el repositorio local para los .aar en libs
repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Aquí agregas tu .aar, sin extensión y con el nombre exacto del archivo
    implementation(name: 'facetec-sdk-9.7.78', ext: 'aar')

    // Otras dependencias que tengas
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0" // o la versión que uses
}
